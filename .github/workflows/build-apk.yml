name: STRIDE Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract STRIDE source
        run: |
          unzip -q STRIDE_SOURCE.zip -d source
          test -f source/stride_work/settings.gradle.kts
          test -f source/stride_work/app/build.gradle.kts

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build Debug APK
        working-directory: source/stride_work
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: STRIDE-debug-APK
          path: source/stride_work/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
